name: Test and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  deploy:
    # Only pushes to master deploy, and only after the tests pass.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    # One deployment at a time. Only deploys join this group, so a PR run can never cancel one,
    # and a deploy already in progress is allowed to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files (no docs, tests or tooling)
        run: |
          mkdir _site
          cp -r index.html core engine solar motor assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
