  <div id="no-webgl" hidden>

    <svg viewBox="0 0 400 170" role="img" aria-label="Earth's tilted axis points the same way all year: toward the Sun in June, away in December">

        <circle cx="200" cy="80" r="22" fill="#fdb813"/>

        <g transform="translate(340 80)">
          <circle r="16" fill="#2563eb"/><line x1="7" y1="-26" x2="-7" y2="26" stroke="currentColor" stroke-width="2"/>
